apiVersion: apps/v1
kind: Deployment
metadata:
  name: rallly
  labels:
    {{- include "rallly.labels" . | nindent 4 }}
    component: rallly
spec:
  # The selector is immutable; it must stay equal to the one of the Deployment this chart adopted
  # from the pre-Helm manifests.
  selector:
    matchLabels:
      stack: rallly
      component: rallly
  template:
    metadata:
      labels:
        stack: rallly
        component: rallly
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # Leaves Next.js its default 30 s to finish requests after the preStop sleep.
      terminationGracePeriodSeconds: {{ add .Values.preStopSleepSeconds 35 }}
      containers:
        - name: rallly
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 3000
          env:
            {{- include "rallly.env" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources.rallly | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          # Endpoint removal and SIGTERM start at the same instant, and Traefik needs a few seconds
          # to stop routing to the pod. Next.js stops accepting connections on SIGTERM, so without
          # the sleep every rollout returns 502s for that window.
          lifecycle:
            preStop:
              sleep:
                seconds: {{ .Values.preStopSleepSeconds }}
          startupProbe:
            {{- include "rallly.probe" . | nindent 12 }}
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            {{- include "rallly.probe" . | nindent 12 }}
            periodSeconds: 30
          volumeMounts:
            - name: next-temp
              mountPath: /app/apps/web/.next/cache
      volumes:
        - name: next-temp
          emptyDir: {}
